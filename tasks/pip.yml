---

- name: Update pip & related tools
  pip:
    name:
      - pip
      - setuptools
      - wheel
      - attrs
      - importlib-metadata
      - packaging
    state: latest
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_python: "{{ openwisp2_python }}"
  retries: 5
  delay: 10
  register: result
  until: result is success
  notify: Reload application

- name: Copy requirements.txt
  copy:
    src: "{{ role_path }}/files/requirements.txt"
    dest: "{{ virtualenv_path }}/requirements.txt"

- name: Install Python dependencies from requirements.txt
  pip:
    requirements: "{{ virtualenv_path }}/requirements.txt"
    state: latest
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_python: "{{ openwisp2_python }}"
  retries: 5
  delay: 10
  register: result
  until: result is success
  notify: Reload application

- name: Install Django with configurable version
  pip:
    name: "{{ openwisp2_django_version }}"
    state: latest
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_python: "{{ openwisp2_python }}"
  retries: 5
  delay: 10
  register: result
  until: result is success
  notify: Reload application
  tags:
    - molecule-idempotence-notest

- name: Install openwisp2 controller
  pip:
    name: "{{ openwisp2_controller_version }}"
    state: latest
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_python: "{{ openwisp2_python }}"
  retries: 5
  delay: 10
  register: result
  until: result is success
  notify: Reload application
  tags:
    - molecule-idempotence-notest

- name: Install openwisp2 network topology
  when: openwisp2_network_topology
  pip:
    name: "{{ openwisp2_network_topology_version }}"
    state: latest
    virtualenv: "{{ virtualenv_path }}"
